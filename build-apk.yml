name: Build Android APK

# This file was developed with the assistance of an AI agent under the direction of qualified RES personnel.
# =====================================================================
#  ONE-FILE APK BUILDER  -  Rhino Energy Solutions
#
#  This single file turns a live, HTTPS-hosted PWA into an installable
#  Android APK. Nothing else needs to be in the repository: no package.json,
#  no capacitor config, no icons, no keystore, no folders. Everything is
#  generated by the steps below.
#
#  >>> THE ONLY PART YOU EVER EDIT IS THE "env:" BLOCK BELOW <<<
# =====================================================================

env:
  APP_NAME: "RES Fleet Inspection"
  APP_ID: "com.rhinoenergy.fleetinspection"
  APP_URL: "https://rhinoenergydavidwh.github.io/res-fleet-inspection/"
  PERMISSIONS: "CAMERA ACCESS_FINE_LOCATION ACCESS_COARSE_LOCATION RECORD_AUDIO MODIFY_AUDIO_SETTINGS"

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Check the three settings and that the app is reachable
        run: |
          set -euo pipefail
          fail() { echo "::error::$1"; exit 1; }

          case "$APP_NAME" in
            "YOUR APP NAME"|"") fail "APP_NAME at the top of build-apk.yml has not been filled in." ;;
          esac
          printf '%s' "$APP_NAME" | grep -Eq '^[A-Za-z0-9 .,-]+$' \
            || fail "APP_NAME may only contain letters, numbers, spaces and . , - (no apostrophes, & < > or quotes)."

          [ "$APP_ID" != "com.rhinoenergy.yourapp" ] || fail "APP_ID at the top of build-apk.yml has not been filled in."
          printf '%s' "$APP_ID" | grep -Eq '^[a-z][a-z0-9_]*(\.[a-z][a-z0-9_]*)+$' \
            || fail "APP_ID must look like com.rhinoenergy.vehiclecheck (lowercase, dots between parts, each part starts with a letter, no hyphens)."
          [ "$APP_ID" != "com.rhinoenergy.toolcheck" ] || fail "APP_ID com.rhinoenergy.toolcheck belongs to Rhino Tool Check - pick a different one."

          case "$APP_URL" in
            *YOUR-USERNAME*|*YOUR-REPO*) fail "APP_URL at the top of build-apk.yml has not been filled in." ;;
          esac
          printf '%s' "$APP_URL" | grep -Eq '^https://[^ "]+$' || fail "APP_URL must start with https:// and contain no spaces or quotes."
          case "$APP_URL" in */) ;; *) APP_URL="$APP_URL/" ;; esac
          echo "APP_URL_NORMALISED=$APP_URL" >> "$GITHUB_ENV"

          printf '%s' "$PERMISSIONS" | grep -Eq '^[A-Z_]+( [A-Z_]+)*$' || fail "PERMISSIONS may only contain UPPER_CASE words separated by single spaces."

          code=$(curl -sSL -o /dev/null -w '%{http_code}' --max-time 30 "$APP_URL" || true)
          [ "$code" = "200" ] || fail "Could not open $APP_URL (HTTP status: $code). Open it in a browser first."

          slug=$(printf '%s' "$APP_NAME" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9]+/-/g; s/^-+//; s/-+$//')
          [ -n "$slug" ] || slug="app"
          echo "APK_SLUG=$slug" >> "$GITHUB_ENV"
          echo "OK: $APP_NAME / $APP_ID / $APP_URL  ->  $slug"

      - name: Generate package.json, Capacitor config and offline page
        run: |
          set -euo pipefail
          mkdir -p www assets
          node <<'EOF'
          const fs = require('fs');
          const name = process.env.APP_NAME;
          const esc = s => s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
          fs.writeFileSync('package.json', JSON.stringify({
            name: process.env.APK_SLUG,
            version: '1.0.0',
            private: true,
            dependencies: {
              '@capacitor/android': '^6.1.2',
              '@capacitor/core': '^6.1.2',
              '@capacitor/filesystem': '^6.0.1',
              '@capacitor/share': '^6.0.2'
            },
            devDependencies: {
              '@capacitor/assets': '^3.0.5',
              '@capacitor/cli': '^6.1.2'
            }
          }, null, 2) + '\n');
          fs.writeFileSync('capacitor.config.json', JSON.stringify({
            appId: process.env.APP_ID,
            appName: name,
            webDir: 'www',
            server: { url: process.env.APP_URL_NORMALISED, androidScheme: 'https' }
          }, null, 2) + '\n');
          fs.writeFileSync('www/index.html', `<!doctype html>
          <html lang="en"><head><meta charset="utf-8">
          <meta name="viewport" content="width=device-width,initial-scale=1">
          <title>${esc(name)}</title>
          <style>
          body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#3F3F40;color:#D6D6D6;font-family:system-ui,sans-serif;text-align:center;padding:24px;box-sizing:border-box}
          h1{color:#FDDD00;margin:0 0 12px}
          p{max-width:420px;margin:0 auto 20px;line-height:1.5}
          button{background:#FDDD00;color:#3F3F40;border:0;border-radius:8px;padding:12px 28px;font-size:16px;font-weight:700}
          </style></head><body><div>
          <h1>${esc(name)}</h1>
          <p>Can't reach the app right now. Check that this device is online, then try again.</p>
          <button onclick="location.reload()">Retry</button>
          </div></body></html>
          `);
          EOF
          cat package.json capacitor.config.json

      - name: Generate icon and splash artwork from the app's own manifest
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund
          node <<'EOF'
          const fs = require('fs');
          const sharp = require('sharp');
          const base = process.env.APP_URL_NORMALISED;
          const appName = process.env.APP_NAME;
          const FALLBACK_BG = '#3F3F40';

          const hexToRgb = h => {
            const m = /^#([0-9a-f]{6})$/i.exec((h || '').trim());
            return m ? { r: parseInt(m[1].slice(0,2),16), g: parseInt(m[1].slice(2,4),16), b: parseInt(m[1].slice(4,6),16) } : null;
          };
          const TRANSPARENT = { r: 0, g: 0, b: 0, alpha: 0 };

          async function getIconBuffer() {
            try {
              const html = await (await fetch(base)).text();
              let href = null;
              const tag = html.match(/<link[^>]+rel=["']?manifest["']?[^>]*>/i);
              if (tag) { const h = tag[0].match(/href=["']([^"']+)["']/i); if (h) href = h[1]; }
              const candidates = href ? [new URL(href, base).href] : [];
              for (const c of ['manifest.json', 'manifest.webmanifest']) candidates.push(new URL(c, base).href);
              for (const murl of candidates) {
                const r = await fetch(murl);
                if (!r.ok) continue;
                const manifest = await r.json();
                const icons = (manifest.icons || []).filter(i => i && i.src);
                if (!icons.length) continue;
                const size = i => Math.max(0, ...String(i.sizes || '0').split(/\s+/).map(s => parseInt(s, 10) || 0));
                const plain = icons.filter(i => !/maskable/.test(i.purpose || ''));
                const pool = (plain.length ? plain : icons).sort((a, b) => size(b) - size(a));
                for (const ic of pool) {
                  const ir = await fetch(new URL(ic.src, murl).href);
                  if (!ir.ok) continue;
                  const buf = Buffer.from(await ir.arrayBuffer());
                  await sharp(buf).metadata();
                  const manifestBg = hexToRgb(manifest.background_color) || hexToRgb(manifest.theme_color);
                  console.log('Using manifest icon:', new URL(ic.src, murl).href);
                  return { buf, manifestBg };
                }
              }
            } catch (e) { console.log('Icon lookup problem:', e.message); }
            return null;
          }

          async function initialsIcon() {
            const initials = appName.split(/\s+/).filter(Boolean).slice(0, 2).map(w => w[0].toUpperCase()).join('') || 'A';
            const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024"><rect width="1024" height="1024" fill="#3F3F40"/><text x="512" y="512" dy="0.36em" font-family="DejaVu Sans, Arial, sans-serif" font-size="440" font-weight="700" fill="#FDDD00" text-anchor="middle">${initials}</text></svg>`;
            return { buf: Buffer.from(svg), manifestBg: hexToRgb(FALLBACK_BG) };
          }

          (async () => {
            let found = await getIconBuffer();
            if (!found) {
              console.log('::warning::No usable icon found in the PWA manifest - using a generic initials icon.');
              found = await initialsIcon();
            }
            const { buf, manifestBg } = found;
            const px = await sharp(buf).resize(64, 64, { fit: 'fill' }).ensureAlpha().raw().toBuffer();
            let bg = px[3] >= 250 ? { r: px[0], g: px[1], b: px[2] } : (manifestBg || hexToRgb(FALLBACK_BG));
            const bgA = { ...bg, alpha: 1 };
            await sharp(buf).resize(1024, 1024, { fit: 'contain', background: bgA }).flatten({ background: bg }).png().toFile('assets/icon.png');
            await sharp({ create: { width: 1024, height: 1024, channels: 3, background: bg } }).png().toFile('assets/icon-background.png');
            const fg = await sharp(buf).resize(696, 696, { fit: 'contain', background: TRANSPARENT }).png().toBuffer();
            await sharp({ create: { width: 1024, height: 1024, channels: 4, background: TRANSPARENT } })
              .composite([{ input: fg, gravity: 'centre' }]).png().toFile('assets/icon-foreground.png');
            const logo = await sharp(buf).resize(700, 700, { fit: 'contain', background: TRANSPARENT }).png().toBuffer();
            for (const f of ['assets/splash.png', 'assets/splash-dark.png']) {
              await sharp({ create: { width: 2732, height: 2732, channels: 3, background: bg } })
                .composite([{ input: logo, gravity: 'centre' }]).png().toFile(f);
            }
            console.log('Artwork written, background colour', JSON.stringify(bg));
          })().catch(e => { console.error('::error::Artwork generation failed: ' + e.stack); process.exit(1); });
          EOF
          ls -l assets

      - name: Add Android platform
        run: npx cap add android

      - name: Generate launcher icons & splash screen
        run: npx capacitor-assets generate --android
        continue-on-error: true

      - name: Add permissions and set the version number
        run: |
          set -euo pipefail
          M=android/app/src/main/AndroidManifest.xml
          for p in $PERMISSIONS; do
            grep -q "android.permission.$p\"" "$M" || sed -i "s|<application|<uses-permission android:name=\"android.permission.$p\" />\n    <application|" "$M"
          done
          case " $PERMISSIONS " in *" CAMERA "*)
            sed -i 's|<application|<uses-feature android:name="android.hardware.camera" android:required="false" />\n    <uses-feature android:name="android.hardware.camera.autofocus" android:required="false" />\n    <application|' "$M" ;; esac
          case " $PERMISSIONS " in *" ACCESS_FINE_LOCATION "*)
            sed -i 's|<application|<uses-feature android:name="android.hardware.location.gps" android:required="false" />\n    <application|' "$M" ;; esac
          G=android/app/build.gradle
          sed -i -E "s/versionCode [0-9]+/versionCode ${GITHUB_RUN_NUMBER}/; s/versionName \"[^\"]*\"/versionName \"1.0.${GITHUB_RUN_NUMBER}\"/" "$G"
          grep -E 'versionCode|versionName' "$G"
          cat "$M"

      - name: Sync web assets into the Android project
        run: npx cap sync android

      - name: Use a fixed debug signing key
        run: |
          set -euo pipefail
          mkdir -p ~/.android
          echo '' | base64 -d > ~/.android/debug.keystore
          keytool -list -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey | head -n 3

      - name: Build debug APK
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Name the APK with the build number
        run: |
          set -euo pipefail
          mkdir -p out
          cp android/app/build/outputs/apk/debug/app-debug.apk "out/${APK_SLUG}-${GITHUB_RUN_NUMBER}.apk"
          ls -l out

      - name: Upload APK as a build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APK_SLUG }}-apk
          path: out/*.apk
          retention-days: 90

      - name: Publish APK on the Releases page (tap-to-install on the tablet)
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "build-${GITHUB_RUN_NUMBER}" out/*.apk \
            --repo "${GITHUB_REPOSITORY}" \
            --target "${GITHUB_SHA}" \
            --title "${APP_NAME} - build ${GITHUB_RUN_NUMBER}" \
            --notes "Debug-signed APK for ${APP_NAME}. Open this page on the tablet and tap the .apk file to install. Installs over the top of the previous build."
